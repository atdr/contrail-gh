name: Check template

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    # Only meaningful in the template itself. A repo created from it has real
    # data in the CSV and may sit on an older schema until its next sync, so
    # these checks would fail there for no good reason.
    if: github.repository == 'atdr/contrail-gh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the contrail version this template pins
        run: |
          PIN=$(grep -o 'contrail\.git@v[0-9][0-9.]*' .github/workflows/sync.yml | head -1 | cut -d@ -f2)
          echo "Pinned version: $PIN"
          pip install "contrail @ git+https://github.com/atdr/contrail.git@${PIN}"

      - name: The shipped header must match that version's schema
        run: |
          python - <<'PY'
          import csv, sys
          from contrail.storage.local_csv import CSV_FIELDS

          with open("flight_emissions.csv", newline="") as f:
              header = next(csv.reader(f))

          if header != CSV_FIELDS:
              print("flight_emissions.csv is out of step with the pinned contrail.")
              print("  missing:", [c for c in CSV_FIELDS if c not in header])
              print("  extra:  ", [c for c in header if c not in CSV_FIELDS])
              print("\nRegenerate it:")
              print("  python -c 'from contrail.storage.local_csv import CSV_FIELDS;"
                    " print(\",\".join(CSV_FIELDS))' > flight_emissions.csv")
              sys.exit(1)
          print(f"header matches ({len(header)} columns)")
          PY

      - name: The template must never carry real flight data
        run: |
          LINES=$(wc -l < flight_emissions.csv)
          if [ "$LINES" -ne 1 ]; then
            echo "flight_emissions.csv has $LINES lines; this repo is public and it must be"
            echo "the header row only. Someone's itinerary may have been committed."
            exit 1
          fi
          if [ -e flight_emissions.raw.jsonl ]; then
            echo "flight_emissions.raw.jsonl must not be committed here: it holds real"
            echo "provider responses for real flights."
            exit 1
          fi

          # The sharpest of the three. A Flighty export is an entire flight
          # history in one file, and unlike the log it arrives by hand, so
          # nothing else would catch it.
          FOUND=$(find flighty -name '*.csv' 2>/dev/null)
          if [ -n "$FOUND" ]; then
            echo "flighty/ holds a CSV in the public template:"
            echo "$FOUND"
            echo "A Flighty export is someone's entire travel history. Exports belong"
            echo "only in a private repo created from this one."
            exit 1
          fi
          echo "header-only, no raw log, no exports"

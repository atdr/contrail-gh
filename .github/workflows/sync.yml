name: sync

on:
  schedule:
    # 15:37 UTC daily. Deliberately off the hour: scheduled runs on the hour
    # queue behind everyone else's and get delayed. This is UTC and does not
    # shift with BST/DST.
    - cron: "37 15 * * *"
  # Puts a "Run workflow" button in the Actions tab, so you can test without
  # waiting for the schedule. The button only appears once this file is on your
  # repository's default branch.
  workflow_dispatch: {}

permissions:
  # Required. GITHUB_TOKEN has been read-only by default since February 2023,
  # and without this the commit-back step fails with a 403.
  contents: write

jobs:
  sync:
    name: sync flight emissions
    # A bound on a hang, not a budget for the work. An hour is far above any
    # real sync — even the first run, which backfills a whole TripIt feed —
    # and far below GitHub's six-hour default. Don't tighten it to discipline
    # runtime: a sync killed mid-run commits nothing, so every emissions
    # figure it had already fetched is lost, and TIM will not price a flight
    # once it has departed.
    timeout-minutes: 60
    # The mirror of the guard in check-template.yml. This workflow is inert in
    # the template itself, which has no secrets and no flight log to update —
    # it would just fail on a schedule forever. It runs in the repo you created
    # from the template, whose name differs.
    if: github.repository != 'atdr/contrail-gh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # requirements.txt is the only place the version is decided — never
      # track main. Dependabot proposes the bump; merging its PR is still the
      # deliberate step.
      - name: Install contrail
        run: pip install -r requirements.txt

      - name: Sync
        env:
          TRIPIT_ICAL_URL: ${{ secrets.TRIPIT_ICAL_URL }}
          TIM_API_KEY: ${{ secrets.TIM_API_KEY }}
          # Flighty exports committed to flighty/, if you keep any. An empty or
          # missing directory is an ordinary state, not an error — it warns and
          # the TripIt feed carries the sync on its own. TripIt is listed first
          # in contrail's env config, so it owns any row both describe and the
          # export fills in blanks like the cabin actually flown.
          FLIGHTY_CSV_PATH: flighty/
        run: contrail sync --csv-path flight_emissions.csv

      - name: Keepalive marker
        # GitHub disables scheduled workflows after 60 days with no repository
        # activity. A quiet stretch of travel could easily mean no new-flight
        # commits for that long, so always touch a timestamp file.
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > last_checked.txt

      - name: Detect changes
        id: detect
        run: |
          # Intent-to-add, not a real `git add`: nothing here is committed by
          # git. The next step reads these same paths off disk and ships them
          # through the API, so the index is scratch state for a runner that's
          # discarded either way — this just makes untracked new files (a
          # first-ever raw.jsonl, say) show up in the diff below.
          git add -N flight_emissions.csv last_checked.txt
          # The sidecar holds everything the emissions API returned; TIM
          # will not answer for a flight once it has departed.
          git add -N flight_emissions.raw.jsonl 2>/dev/null || true
          changed=$(git diff --name-only -- flight_emissions.csv last_checked.txt flight_emissions.raw.jsonl)
          if [ -z "$changed" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$changed"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        # A plain `git commit` here can never come back Verified: GitHub only
        # signs commits it constructs itself, so this goes through the
        # createCommitOnBranch GraphQL mutation instead of git. That also
        # retires the git-identity config this step used to need — author and
        # committer both come from whatever token calls the API, which for
        # GITHUB_TOKEN is github-actions[bot] — and expectedHeadOid fails the
        # run instead of silently overwriting a commit that landed here since
        # checkout.
        if: steps.detect.outputs.has_changes == 'true'
        uses: actions/github-script@v9
        env:
          CHANGED_FILES: ${{ steps.detect.outputs.files }}
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const branch = context.ref.replace("refs/heads/", "");
            const { data: head } = await github.rest.repos.getBranch({ owner, repo, branch });
            const files = process.env.CHANGED_FILES.split("\n").filter(Boolean);
            await github.graphql(
              `mutation ($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) { commit { oid } }
              }`,
              {
                input: {
                  branch: { repositoryNameWithOwner: `${owner}/${repo}`, branchName: branch },
                  message: { headline: "Sync flight emissions" },
                  expectedHeadOid: head.commit.sha,
                  fileChanges: {
                    additions: files.map((path) => ({
                      path,
                      contents: fs.readFileSync(path).toString("base64"),
                    })),
                  },
                },
              },
            );

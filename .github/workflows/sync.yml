name: sync

on:
  schedule:
    # 15:37 UTC daily. Deliberately off the hour: scheduled runs on the hour
    # queue behind everyone else's and get delayed. This is UTC and does not
    # shift with BST/DST.
    - cron: "37 15 * * *"
  # Puts a "Run workflow" button in the Actions tab, so you can test without
  # waiting for the schedule. The button only appears once this file is on your
  # repository's default branch.
  workflow_dispatch: {}

permissions:
  # Required. GITHUB_TOKEN has been read-only by default since February 2023,
  # and without this the commit-back step fails with a 403.
  contents: write

jobs:
  sync:
    name: sync flight emissions
    # A bound on a hang, not a budget for the work. An hour is far above any
    # real sync — even the first run, which backfills a whole TripIt feed —
    # and far below GitHub's six-hour default. Don't tighten it to discipline
    # runtime: a sync killed mid-run commits nothing, so every emissions
    # figure it had already fetched is lost, and TIM will not price a flight
    # once it has departed.
    timeout-minutes: 60
    # The mirror of the guard in check-template.yml. This workflow is inert in
    # the template itself, which has no secrets and no flight log to update —
    # it would just fail on a schedule forever. It runs in the repo you created
    # from the template, whose name differs.
    if: github.repository != 'atdr/contrail-gh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # requirements.txt is the only place the version is decided — never
      # track main. Dependabot proposes the bump; merging its PR is still the
      # deliberate step.
      - name: Install contrail
        run: pip install -r requirements.txt

      - name: Sync
        env:
          TRIPIT_ICAL_URL: ${{ secrets.TRIPIT_ICAL_URL }}
          TIM_API_KEY: ${{ secrets.TIM_API_KEY }}
          # Flighty exports committed to flighty/, if you keep any. An empty or
          # missing directory is an ordinary state, not an error — it warns and
          # the TripIt feed carries the sync on its own. TripIt is listed first
          # in contrail's env config, so it owns any row both describe and the
          # export fills in blanks like the cabin actually flown.
          FLIGHTY_CSV_PATH: flighty/
        run: contrail sync --csv-path flight_emissions.csv

      # Passport is the log as an interactive dashboard, committed alongside
      # it and exactly as private: never make a repo holding either public.
      #
      # Built every run, but only replaces the committed copy when something
      # besides its generatedAt stamp changed. The stamp and each flight's
      # departed flag are the only parts that depend on the clock, so this
      # catches a changed log, a flight departing, and a contrail upgrade
      # changing the page, without a new 800 KB version in history every day.
      #
      # contrail refuses to build one from a log with no flights, which is where
      # a new repo starts, so a header-only log skips it.
      #
      # continue-on-error so a Passport failure can never cost this sync's data:
      # the commit still runs, and the last step turns the run red afterwards.
      - name: Build the Passport
        id: passport
        continue-on-error: true
        run: |
          if [ "$(wc -l < flight_emissions.csv)" -le 1 ]; then
            echo "No flights in the log yet, so no Passport this run."
            exit 0
          fi
          NEW="$RUNNER_TEMP/passport.html"
          contrail passport --csv-path flight_emissions.csv --output "$NEW"
          strip() { sed -E 's/"generatedAt":"[^"]*"//' "$1"; }
          if [ -f passport.html ] && cmp -s <(strip passport.html) <(strip "$NEW"); then
            echo "Passport unchanged apart from its timestamp; keeping the committed copy."
          else
            mv "$NEW" passport.html
            echo "Passport updated."
          fi

      - name: Keepalive marker
        # GitHub disables scheduled workflows after 60 days with no repository
        # activity. A quiet stretch of travel could easily mean no new-flight
        # commits for that long, so always touch a timestamp file.
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > last_checked.txt

      - name: Commit changes
        # ghcommit-action goes through the same GraphQL API GitHub's own UI
        # uses to commit, so the result is signed and shows as Verified — a
        # plain `git commit` here never could, no matter what identity it
        # configured. file_pattern is scoped to sync's own outputs rather than
        # its "." default, so a repo with stray local changes never commits
        # them by accident.
        #
        # flight_emissions.raw.jsonl and passport.html may not exist yet on a
        # repo's first syncs. That is fine: the action finds changes with
        # `git status -- <file_pattern>`, which ignores a path that isn't there.
        uses: planetscale/ghcommit-action@v0.2.22
        with:
          commit_message: "Sync flight emissions"
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          file_pattern: "flight_emissions.csv last_checked.txt flight_emissions.raw.jsonl passport.html"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Fail the run if the Passport did not build
        if: steps.passport.outcome == 'failure'
        run: |
          echo "The sync was committed, but the Passport step failed. See its log above."
          exit 1

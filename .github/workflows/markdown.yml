# The Markdown check, defined once and called from both check-template.yml and
# check-instance.yml. Those two are guarded by repository name in opposite
# directions, so exactly one of them fires in any repository — in
# atdr/contrail-gh it is check-template.yml, and in a repo created from it,
# check-instance.yml. Defining the check here rather than in each of them is
# what stops the template and an instance drifting into checking different
# things.
#
# Two tools, because neither does the other's job: markdownlint has no rule
# that pads a table cell, and mdformat has no opinion on line length. Settings
# for both live in .markdownlint-cli2.yaml and .mdformat.toml at the root.
#
# In your own repo this runs on your docs, including anything you have added.
# If you would rather it did not, delete the `markdown` job from
# check-instance.yml — nothing else depends on it.
name: markdown

on:
  workflow_call:

permissions:
  contents: read

jobs:
  markdown:
    name: lint
    # A stalled fetch hangs rather than failing, and ten minutes bounds the one
    # that never recovers, which is all a timeout can do. GitHub's default is
    # six hours.
    #
    # It has to live here rather than on the jobs that call this workflow: a
    # job with `uses:` takes no timeout-minutes of its own. Defining it once
    # here covers both callers anyway.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A JavaScript action, so GitHub runs it on the runner's own Node: no
      # toolchain to install, nothing fetched from a registry, and the
      # github-actions dependabot ecosystem in .github/dependabot.yml keeps the
      # pin current. That is why there is no setup-node step here.
      - uses: DavidAnson/markdownlint-cli2-action@v24

      # 3.13 because .mdformat.toml sets `exclude`, which errors below it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # requirements-dev.txt, not requirements.txt: that one carries the
      # contrail pin a sync installs, and has no business holding a formatter.
      # This replaced `npx prettier@3.9.6`, which refetched Prettier from the
      # npm registry every run and sat silent for exactly 301 seconds often
      # enough to dominate a job that otherwise takes twelve.
      - run: pip install -r requirements-dev.txt

      # No filter: .mdformat.toml's `exclude` covers CLAUDE.md.
      - run: mdformat --check .

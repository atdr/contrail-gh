version: 2
updates:
  # Keeps the actions in sync.yml current.
  #
  # Delete this entry if you'd rather not get the PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    # Dependabot counts each atdr/github-boilerplate workflow as its own
    # dependency, so one boilerplate release would open a PR per pinned file.
    # Grouped, the pins move together.
    groups:
      github-boilerplate:
        patterns:
          - "atdr/github-boilerplate*"

  # Proposes the contrail bump in requirements.txt, which sync.yml,
  # check-instance.yml and check-template.yml all install from. It only ever
  # opens the pull request — merging it is still your deliberate step, and
  # check-instance.yml dry-runs it against your own data first.
  #
  # Delete this entry if you'd rather not get the PRs.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

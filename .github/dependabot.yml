version: 2
updates:
  # Keeps the actions in sync.yml current.
  #
  # Delete this entry if you'd rather not get the PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    # Dependabot counts each atdr/github-boilerplate workflow as its own
    # dependency, so one boilerplate release would open a PR per pinned file.
    # Grouped, the pins move together.
    groups:
      github-boilerplate:
        patterns:
          - "atdr/github-boilerplate*"

  # Proposes the contrail bump in requirements.txt, which sync.yml,
  # check-instance.yml and check-template.yml all install from. It only ever
  # opens the pull request — merging it is still your deliberate step, and
  # check-instance.yml dry-runs it against your own data first.
  #
  # Delete this entry if you'd rather not get the PRs.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Dependabot waits 3 days after a release before proposing it, even with no
    # cooldown set, as a guard against a compromised package. contrail is
    # exempt: its releases can carry security fixes, merging is still your
    # step, and check-instance.yml dry-runs the bump against your data first.
    # Everything else keeps the 3 days, stated here so the exclusion cannot
    # quietly change it.
    cooldown:
      default-days: 3
      exclude:
        - contrails
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

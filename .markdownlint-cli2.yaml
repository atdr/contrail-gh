# Markdown rules. mdformat owns whitespace and table alignment; this file owns
# what mdformat cannot express. Both run on every pull request, in
# atdr/contrail-gh and in each repo created from it, via
# .github/workflows/markdown.yml.
#
# This file arrives in your own repo as a copy, not a link. Edit it freely —
# it describes your docs once the repo is yours.
#
# .mdformat.toml carries the formatter's settings and explains them. Two things
# it does not have to say, because mdformat's defaults already do what this
# repo wants: prose is never rewrapped (the prose here is wrapped by hand at
# deliberate points), and the code inside a fence is left alone, being a worked
# example or a command someone will paste rather than source to be tidied.
gitignore: true

# Without this, a bare `markdownlint-cli2` finds nothing and reports success.
globs:
  - "**/*.md"

config:
  MD013:
    # AGENTS.md, flighty/README.md and the skill already hold 80. README.md
    # wraps at 100 and says so in a markdownlint-configure-file comment at its
    # foot.
    line_length: 80
    # A padded table row is wider than any prose limit, and a fenced block is
    # usually a command that must not be broken.
    tables: false
    code_blocks: false
  MD046:
    # GitHub only syntax-highlights fenced blocks, so an indented one silently
    # loses the highlighting the author meant to have.
    style: fenced

ignores:
  # A symlink to AGENTS.md. Linting it reports every line of that file twice.
  - CLAUDE.md
